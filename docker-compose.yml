services:
  hop-web:
    image: apache/hop-web:latest
    container_name: hop-web
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  airflow:
    image: apache/airflow:2.9.3-python3.10
    container_name: airflow
    command: standalone
    ports:
      - "28080:8080"
    environment:
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
